plugins {
    id 'java'
    id 'application'
}

group = 'com.neuralarc'
version = findProperty('releaseVersion') ?: '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.mailjet:mailjet-client:6.0.1'
    implementation 'net.jacobpeterson.alpaca:alpaca-java:10.0.1'
    implementation 'com.formdev:flatlaf:3.6'
    implementation 'com.formdev:flatlaf-extras:3.6'
    implementation 'org.xerial:sqlite-jdbc:3.47.2.0'
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.neuralarc.NeuralArc'
}

tasks.named('jar') {
    manifest {
        attributes(
                'Main-Class': application.mainClass.get(),
                'Implementation-Title': 'NeuralArc',
                'Implementation-Version': project.version
        )
    }
}

tasks.named('processResources') {
    filesMatching('app.properties') {
        expand(version: project.version)
    }
}
