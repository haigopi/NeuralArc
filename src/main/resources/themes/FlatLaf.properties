# Custom FlatLaf defaults layered on top of the active theme (registered in NeuralArc.main).
# Applies to all FlatLaf themes; theme-specific overrides would go in
# FlatDarculaLaf.properties / FlatIntelliJLaf.properties next to this file.

# IntelliJ IDEA blue accent (selection, focus, checkmarks, progress, default buttons).
@accentColor = #3574F0

# Rounded corners, IDEA-style.
Button.arc = 6
Component.arc = 6
TextComponent.arc = 6
CheckBox.arc = 4
ProgressBar.arc = 6

# Thin focus ring like IDEA's new UI.
Component.focusWidth = 1
Component.innerFocusWidth = 0

# Tables: calmer grid, subtle row separation.
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
Table.rowHeight = 24

# Tabs: accent underline like IDEA editor tabs.
TabbedPane.tabSeparatorsFullHeight = true
TabbedPane.showTabSeparators = true
TabbedPane.selectedBackground = lighten($TabbedPane.background,3%)
