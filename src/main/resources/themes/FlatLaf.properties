# Custom FlatLaf defaults layered on top of the active theme (registered in NeuralArc.main).
# Applies to all FlatLaf themes; theme-specific overrides would go in
# FlatDarculaLaf.properties / FlatIntelliJLaf.properties next to this file.

# IntelliJ IDEA blue accent (selection, focus, checkmarks, progress, default buttons).
@accentColor = #3574F0

# Rounded corners, IDEA-style.
Button.arc = 6
Component.arc = 6
TextComponent.arc = 6
CheckBox.arc = 4
ProgressBar.arc = 6

# Thin focus ring like IDEA's new UI.
Component.focusWidth = 1
Component.innerFocusWidth = 0

# Tables: calmer grid, subtle row separation.
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
Table.rowHeight = 24

# Tabs: accent underline like IDEA editor tabs.
TabbedPane.tabSeparatorsFullHeight = true
TabbedPane.showTabSeparators = true
TabbedPane.selectedBackground = lighten($TabbedPane.background,3%)

#---- NeuralArc semantic colors -------------------------------------------
# Resolved through com.neuralarc.util.ThemeColors. Values are tuned for the
# dark (Darcula) theme; relative functions adapt to the active base theme.

# Strategy/history table rows and selection.
NeuralArc.Table.selectionBackground = #4B6EAF
NeuralArc.Table.selectionForeground = #FFFFFF
NeuralArc.Table.selectionBorder = #88ADF0
NeuralArc.Table.selectionBarBackground = #3B5A8A
NeuralArc.Table.rowBackgroundEven = lighten($Table.background,3%)
NeuralArc.Table.rowBackgroundOdd = $Table.background
NeuralArc.TableHeader.background = lighten($TableHeader.background,3%)
NeuralArc.TableHeader.foreground = #BBC3CF

# Event log pane.
NeuralArc.Log.background = darken($Panel.background,4%)
NeuralArc.Log.lineEven = #BCC2CC
NeuralArc.Log.lineOdd = #8A919C

# Position / Rules Triggered detail sections.
NeuralArc.Detail.background = lighten($Panel.background,3%)
NeuralArc.Detail.border = #565B63
NeuralArc.Detail.titleForeground = #9DA6B3
NeuralArc.Detail.foreground = #D5DAE2

# Status and P&L text tones (bright enough for dark row backgrounds).
NeuralArc.pnlPositive = #6CCB81
NeuralArc.pnlNegative = #F07178
NeuralArc.statusOk = #5FB865
NeuralArc.statusWarn = #D9A23E
NeuralArc.statusError = #EF5350
NeuralArc.statusRunning = #6CCB81
NeuralArc.statusPaused = #E0A030
NeuralArc.statusArchived = #9AA1AA
NeuralArc.modePaper = #64B5F6
NeuralArc.modeLive = #EF5350
NeuralArc.entryGainers = #6CCB81
NeuralArc.entryLosers = #E0A030
NeuralArc.captureIndicatorActive = #4DB6AC
NeuralArc.captureIndicatorIdle = #9DA3AD

# Trade history row tints.
NeuralArc.History.buyBackground = #2E3D54
NeuralArc.History.buyForeground = #9CC7F7
NeuralArc.History.sellGainBackground = #2E4434
NeuralArc.History.sellGainForeground = #A5D6A7
NeuralArc.History.sellLossBackground = #4A3034
NeuralArc.History.sellLossForeground = #F2999F
NeuralArc.History.sellFlatBackground = #46402F
NeuralArc.History.sellFlatForeground = #E3C57E
NeuralArc.History.failedBackground = #4A3B2A
NeuralArc.History.failedForeground = #E8B377
NeuralArc.History.completedBackground = #3A3D3F
NeuralArc.History.completedForeground = #A7ADB5
NeuralArc.History.subtotalBackground = #2F3B4D
NeuralArc.History.subtotalForeground = #BBD3F5
NeuralArc.History.groupBorder = #5B6168

NeuralArc.SplitPane.divider = #4E5254

